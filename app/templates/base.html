<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Irus AI — Your Personal AI Command Center</title>

    <!-- PWA -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#09090b">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/icon-192.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Irus AI">

    <!-- UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">

    <!-- Theme bootstrap (no flash of wrong theme) -->
    <script>
        (function () {
            var saved = localStorage.getItem('theme');
            var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', saved || (dark ? 'dark' : 'light'));
        })();
    </script>
</head>
<body class="bg-zinc-950 text-zinc-200">

    <!-- Global toast system -->
    <div id="toast-container" class="fixed top-4 right-4 left-4 md:left-auto md:w-96 z-[300] flex flex-col gap-2 pointer-events-none"></div>
    <script>
        function showToast(message, type = 'success') {
            const box = document.getElementById('toast-container');
            if (!box) return;
            const t = document.createElement('div');
            t.className = `flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl border text-sm font-medium pointer-events-auto animate-pop ${
                type === 'success' ? 'bg-emerald-950/90 border-emerald-800 text-emerald-200' :
                type === 'error' ? 'bg-red-950/90 border-red-800 text-red-200' : 'bg-zinc-900/95 border-zinc-800 text-zinc-200'}`;
            t.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle text-emerald-400' : type === 'error' ? 'fa-exclamation-circle text-red-400' : 'fa-info-circle text-indigo-400'}"></i> ${message}`;
            box.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); }, 3200);
        }
    </script>

    <!-- Flash messages → toasts -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                {% for category, message in messages %}
                showToast("{{ message }}", "{{ 'error' if category == 'error' else 'success' }}");
                {% endfor %}
            });
        </script>
        {% endif %}
    {% endwith %}

    <!-- Admin broadcast banner -->
    <div id="broadcast-banner" class="hidden items-center justify-center gap-3 px-4 py-2 bg-gradient-to-r from-indigo-600 to-purple-600 text-white text-xs font-semibold">
        <i class="fas fa-bullhorn"></i><span id="broadcast-text"></span>
        <button id="broadcast-close" class="ml-2 text-white/70 hover:text-white"><i class="fas fa-xmark"></i></button>
    </div>

    <div class="page-enter">
        {% block content %}{% endblock %}
    </div>

    <script>
        // Service worker (PWA)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
        }
        // Broadcast banner (safe if endpoint missing)
        fetch('/broadcast').then(r => r.ok ? r.json() : null).then(d => {
            if (d && d.active && d.message) {
                document.getElementById('broadcast-text').textContent = d.message;
                const b = document.getElementById('broadcast-banner');
                b.classList.remove('hidden'); b.classList.add('flex');
            }
        }).catch(() => {});
        document.getElementById('broadcast-close').addEventListener('click', () => {
            document.getElementById('broadcast-banner').classList.add('hidden');
        });
    </script>
</body>
</html>
