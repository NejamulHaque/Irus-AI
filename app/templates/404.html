{% extends "base.html" %}
{% block title %}Page Not Found — Irus AI{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex flex-col items-center justify-center text-center px-4">
    <img src="{{ url_for('static', filename='icons/icon-192.png') }}" class="icon-float w-20 h-20 object-cover mb-6" alt="Irus AI">
    <p class="text-7xl md:text-8xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent mb-4">404</p>
    <h1 class="text-2xl font-bold text-white mb-2">Houston, we lost this page.</h1>
    <p class="text-sm text-zinc-500 mb-8 max-w-md">The page you're looking for doesn't exist or has been moved into another dimension.</p>
    <div class="flex gap-3">
        <a href="/" class="btn btn-primary"><i class="fas fa-home"></i> Back to Home</a>
        <a href="/auth" class="btn btn-ghost"><i class="fas fa-rocket"></i> Launch App</a>
    </div>
</div>
{% endblock %}
