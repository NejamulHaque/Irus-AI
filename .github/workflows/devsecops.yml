name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------- 1. Security Scans (Shift-Left) ----------
  security-scans:
    name: Secrets + SAST + SCA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — Secrets Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Bandit — Python SAST
        run: bandit -r app/ -ll

      - name: pip-audit — Dependency Vulnerabilities (OSV)
        run: pip-audit -r requirements.txt

  # ---------- 2. Quality Gates ----------
  test:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Ruff — Lint (advisory)
        run: ruff check .
        continue-on-error: true
      - name: Pytest — Security & Smoke Tests
        run: python -m pytest -q

  # ---------- 3. Container Security ----------
  container:
    name: Docker Build + Trivy CVE Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build hardened image
        run: docker build -t irus-ai:${{ github.sha }} .
      - name: Trivy — Image Scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: irus-ai:${{ github.sha }}
          severity: 'CRITICAL'
          exit-code: '1'

  # ---------- 4. Continuous Deployment ----------
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [security-scans, test, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render Deploy Hook
        if: ${{ env.HOOK != '' }}
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$HOOK"