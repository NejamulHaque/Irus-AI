name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scans:
    name: Secrets + SAST + SCA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — Secrets Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Bandit — Python SAST
        run: bandit -r app/ -ll --skip B311,B113,B110,B112

      - name: pip-audit — Dependency Vulnerabilities (OSV)
        run: pip-audit -r requirements.txt

  test:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Ruff — Lint (advisory)
        run: ruff check .
        continue-on-error: true
      - name: Pytest — Security & Smoke Tests
        run: python -m pytest -q

  container:
    name: Docker Build + Trivy CVE Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build hardened image
        run: docker build -t irus-ai:${{ github.sha }} .
      - name: Trivy — Image Scan (report only, non-blocking)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: irus-ai:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'        # report CVEs but don't block the pipeline
          ignore-unfixed: true  # only count CVEs that have a fix available

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [security-scans, test, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render Deploy Hook
        if: ${{ env.HOOK != '' }}
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$HOOK"
